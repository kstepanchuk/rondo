name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build
        # TODO: drop LEGACY_ZIP after v0.1.4 (lets ≤0.1.3 self-update one last time from a .zip).
        env:
          LEGACY_ZIP: "1"
        run: ./scripts/build.sh "${GITHUB_REF_NAME#v}"
      - name: Self-test
        run: |
          mkdir -p /tmp/st && printf 'hello' > /tmp/st/a.txt
          dist/Rondo.app/Contents/MacOS/Rondo --self-test /tmp/st
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --title "Rondo $V" --generate-notes dist/Rondo-"$V".*
